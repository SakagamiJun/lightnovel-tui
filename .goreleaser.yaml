version: 2

project_name: lnr

builds:
  - id: lnr
    main: ./cmd/lnr
    binary: lnr
    env:
      - CGO_ENABLED=0
    targets:
      - darwin_arm64
      - linux_amd64_v1
      - windows_amd64_v1
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X github.com/SakagamiJun/lightnovel-tui/pkg/version.Version={{.Tag}}
      - -X github.com/SakagamiJun/lightnovel-tui/pkg/version.GitCommit={{.ShortCommit}}
      - -X github.com/SakagamiJun/lightnovel-tui/pkg/version.BuildDate={{.Date}}

  - id: lnr-tui
    main: ./cmd/lnr-tui
    binary: lnr-tui
    env:
      - CGO_ENABLED=0
    targets:
      - darwin_arm64
      - linux_amd64_v1
      - windows_amd64_v1
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X github.com/SakagamiJun/lightnovel-tui/pkg/version.Version={{.Tag}}
      - -X github.com/SakagamiJun/lightnovel-tui/pkg/version.GitCommit={{.ShortCommit}}
      - -X github.com/SakagamiJun/lightnovel-tui/pkg/version.BuildDate={{.Date}}

archives:
  - id: default
    name_template: "lnr-{{ .Tag }}-{{ .Os }}-{{ .Arch }}"
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    files:
      - README.md
      - LICENSE

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc
  use: git
  groups:
    - title: "### Features"
      regexp: '^.*?feat(\([^\)]+\))?:'
      order: 0
    - title: "### Bug Fixes"
      regexp: '^.*?fix(\([^\)]+\))?:'
      order: 1
    - title: "### Performance & Refactoring"
      regexp: '^.*?(perf|refactor)(\([^\)]+\))?:'
      order: 2
    - title: "### Maintenance & Documentation"
      order: 99
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"
      - "^chore:"
      - "Merge pull request"
      - "Merge branch"
