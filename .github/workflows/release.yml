name: Release

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump"
        required: false
        default: auto
        type: choice
        options:
          - auto
          - patch
          - minor
          - major

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare-version:
    name: Prepare Semantic Version
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
      skip: ${{ steps.version.outputs.skip }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Calculate release version
        id: version
        shell: bash
        env:
          BUMP: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.bump || 'auto' }}
        run: |
          set -euo pipefail
          ./scripts/calculate_version.sh >> "$GITHUB_OUTPUT"

      - name: Create and push git tag
        if: steps.version.outputs.skip != 'true'
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          if git ls-remote --tags origin "refs/tags/${TAG}" | grep -q .; then
            echo "Tag ${TAG} already exists on remote."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag "$TAG"
            git push origin "$TAG"
          fi

  build-and-package:
    name: Build (${{ matrix.name }})
    needs: prepare-version
    if: needs.prepare-version.outputs.skip != 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: darwin-arm64
            os: macos-latest
            target_os: darwin
            target_arch: arm64
            archive: lnr-v${{ needs.prepare-version.outputs.version }}-darwin-arm64.tar.gz
          - name: darwin-amd64
            os: macos-latest
            target_os: darwin
            target_arch: amd64
            archive: lnr-v${{ needs.prepare-version.outputs.version }}-darwin-amd64.tar.gz
          - name: linux-amd64
            os: ubuntu-latest
            target_os: linux
            target_arch: amd64
            archive: lnr-v${{ needs.prepare-version.outputs.version }}-linux-amd64.tar.gz
          - name: linux-arm64
            os: ubuntu-latest
            target_os: linux
            target_arch: arm64
            archive: lnr-v${{ needs.prepare-version.outputs.version }}-linux-arm64.tar.gz
          - name: windows-amd64
            os: windows-latest
            target_os: windows
            target_arch: amd64
            archive: lnr-v${{ needs.prepare-version.outputs.version }}-windows-amd64.zip

    steps:
      - name: Checkout tagged commit
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare-version.outputs.tag }}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Package artifact
        shell: bash
        env:
          VERSION: ${{ needs.prepare-version.outputs.tag }}
          TARGET_OS: ${{ matrix.target_os }}
          TARGET_ARCH: ${{ matrix.target_arch }}
          DIST_DIR: dist
        run: |
          set -euo pipefail
          ./scripts/package.sh

      - name: Upload packaged artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: dist/${{ matrix.archive }}
          if-no-files-found: error

  publish-release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: [prepare-version, build-and-package]
    if: needs.prepare-version.outputs.skip != 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare-version.outputs.tag }}
          fetch-depth: 0

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Generate master checksums.txt
        shell: bash
        run: |
          set -euo pipefail
          cd release-assets
          sha256sum * > checksums.txt
          cat checksums.txt

      - name: Generate release notes
        shell: bash
        env:
          TAG: ${{ needs.prepare-version.outputs.tag }}
        run: |
          set -euo pipefail
          ./scripts/generate_release_notes.sh > release_notes.md
          cat release_notes.md

      - name: Publish Release to GitHub
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ needs.prepare-version.outputs.tag }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if gh release view "$TAG_NAME" --repo "$REPO" >/dev/null 2>&1; then
            gh release upload "$TAG_NAME" release-assets/* --repo "$REPO" --clobber
          else
            gh release create "$TAG_NAME" release-assets/* \
              --repo "$REPO" \
              --title "LightNovelReader ${TAG_NAME}" \
              --notes-file release_notes.md
          fi

  sync-homebrew:
    name: Sync Homebrew Formula
    runs-on: ubuntu-latest
    needs: [prepare-version, publish-release]
    if: needs.prepare-version.outputs.skip != 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare-version.outputs.tag }}

      - name: Download release assets for checksum extraction
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Calculate SHA256 for Homebrew formula
        id: sha
        shell: bash
        env:
          VERSION: ${{ needs.prepare-version.outputs.version }}
        run: |
          set -euo pipefail
          cd release-assets
          echo "darwin_arm64_sha=$(sha256sum lnr-v${VERSION}-darwin-arm64.tar.gz | awk '{print $1}')" >> "$GITHUB_OUTPUT"
          echo "darwin_amd64_sha=$(sha256sum lnr-v${VERSION}-darwin-amd64.tar.gz | awk '{print $1}')" >> "$GITHUB_OUTPUT"
          echo "linux_arm64_sha=$(sha256sum lnr-v${VERSION}-linux-arm64.tar.gz | awk '{print $1}')" >> "$GITHUB_OUTPUT"
          echo "linux_amd64_sha=$(sha256sum lnr-v${VERSION}-linux-amd64.tar.gz | awk '{print $1}')" >> "$GITHUB_OUTPUT"

      - name: Sync Formula to Homebrew Tap
        env:
          PAT_TOKEN: ${{ secrets.PAT_TOKEN }}
          VERSION: ${{ needs.prepare-version.outputs.version }}
          TAG: ${{ needs.prepare-version.outputs.tag }}
          DARWIN_ARM64_SHA: ${{ steps.sha.outputs.darwin_arm64_sha }}
          DARWIN_AMD64_SHA: ${{ steps.sha.outputs.darwin_amd64_sha }}
          LINUX_ARM64_SHA: ${{ steps.sha.outputs.linux_arm64_sha }}
          LINUX_AMD64_SHA: ${{ steps.sha.outputs.linux_amd64_sha }}
        run: |
          set -euo pipefail
          if [[ -z "${PAT_TOKEN:-}" ]]; then
            echo "PAT_TOKEN secret not configured, skipping Homebrew sync."
            exit 0
          fi

          git clone "https://x-access-token:${PAT_TOKEN}@github.com/SakagamiJun/homebrew-tap.git" /tmp/homebrew-tap

          TAP_DIR=/tmp/homebrew-tap \
          VERSION="$VERSION" \
          DARWIN_ARM64_SHA="$DARWIN_ARM64_SHA" \
          DARWIN_AMD64_SHA="$DARWIN_AMD64_SHA" \
          LINUX_ARM64_SHA="$LINUX_ARM64_SHA" \
          LINUX_AMD64_SHA="$LINUX_AMD64_SHA" \
          ./scripts/update_formula.sh

          cd /tmp/homebrew-tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/lnr.rb

          if git diff --staged --quiet; then
            echo "No changes in Formula/lnr.rb, skipping commit."
            exit 0
          fi

          git commit -m "chore(release): update lnr formula to ${TAG}"
          git push origin main
