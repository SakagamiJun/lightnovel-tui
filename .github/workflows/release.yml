name: Release

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump"
        required: false
        default: auto
        type: choice
        options:
          - auto
          - patch
          - minor
          - major

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare-version:
    name: Prepare Semantic Version
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
      skip: ${{ steps.version.outputs.skip }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Calculate release version
        id: version
        shell: bash
        env:
          BUMP: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.bump || 'auto' }}
        run: |
          set -euo pipefail
          ./scripts/calculate_version.sh >> "$GITHUB_OUTPUT"

      - name: Create and push git tag
        if: steps.version.outputs.skip != 'true'
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          if git ls-remote --tags origin "refs/tags/${TAG}" | grep -q .; then
            echo "Tag ${TAG} already exists on remote."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag "$TAG"
            git push origin "$TAG"
          fi

  release:
    name: Build & Publish (GoReleaser)
    runs-on: ubuntu-latest
    needs: prepare-version
    if: needs.prepare-version.outputs.skip != 'true'
    steps:
      - name: Checkout tagged commit
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare-version.outputs.tag }}
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Sync Formula to Homebrew Tap
        env:
          PAT_TOKEN: ${{ secrets.PAT_TOKEN }}
          VERSION: ${{ needs.prepare-version.outputs.version }}
          TAG: ${{ needs.prepare-version.outputs.tag }}
        run: |
          set -euo pipefail
          if [[ -z "${PAT_TOKEN:-}" ]]; then
            echo "PAT_TOKEN secret not configured, skipping Homebrew sync."
            exit 0
          fi

          DARWIN_ARM64_SHA="$(grep 'darwin-arm64' dist/checksums.txt | awk '{print $1}')"
          LINUX_AMD64_SHA="$(grep 'linux-amd64' dist/checksums.txt | awk '{print $1}')"

          git clone "https://x-access-token:${PAT_TOKEN}@github.com/SakagamiJun/homebrew-tap.git" /tmp/homebrew-tap

          TAP_DIR=/tmp/homebrew-tap \
          VERSION="$VERSION" \
          DARWIN_ARM64_SHA="$DARWIN_ARM64_SHA" \
          LINUX_AMD64_SHA="$LINUX_AMD64_SHA" \
          ./scripts/update_formula.sh

          cd /tmp/homebrew-tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/lnr.rb

          if git diff --staged --quiet; then
            echo "No changes in Formula/lnr.rb, skipping commit."
            exit 0
          fi

          git commit -m "chore(release): update lnr formula to ${TAG}"
          git push origin main
