name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: Test & Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Run go vet
        run: go vet ./...

      - name: Run unit tests with race detector
        run: go test -short -race -v ./...

  build-check:
    name: Build Check (Linux & Cross-Platform)
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Build CLI & TUI (Native Linux)
        run: |
          go build -v ./cmd/lnr
          go build -v ./cmd/lnr-tui

      - name: Cross-compile verification (Darwin & Windows)
        run: |
          GOOS=darwin GOARCH=arm64 go build ./cmd/lnr
          GOOS=windows GOARCH=amd64 go build ./cmd/lnr
